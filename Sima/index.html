<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicTacToe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="kiirok">
      <div id="xKiiro" class="kovetkezik">
        <h2 class="green">X</h2>
        <p>0</p>
      </div>
      <div id="dontetlenKiiro">
        <h2>/</h2>
        <p>0</p>
      </div>
      <div id="oKiiro">
        <h2 class="red">O</h2>
        <p>0</p>
      </div>
    </div>
    <div class="tictactoecontainer">
      <div>
        <button id="00"></button>
      </div>
      <div>
        <button id="01"></button>
      </div>
      <div>
        <button id="02"></button>
      </div>
      <div>
        <button id="10"></button>
      </div>
      <div>
        <button id="11"></button>
      </div>
      <div>
        <button id="12"></button>
      </div>
      <div>
        <button id="20"></button>
      </div>
      <div>
        <button id="21"></button>
      </div>
      <div>
        <button id="22"></button>
      </div>
    </div>
    <button id="reset" onclick="reset()">ÚJ JÁTÉK</button>
  </body>
  <script src="script.js"></script>
</html>
